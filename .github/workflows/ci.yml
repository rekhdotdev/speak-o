name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notices
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:accessibility
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:run
      - name: Upload unpacked-Chromium evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: speak-o-e2e-${{ github.sha }}
          path: |
            playwright-report/
            test-results/e2e/
          if-no-files-found: warn
          retention-days: 14
      - run: npm run zip
      - run: npm run audit:zip
